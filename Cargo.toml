# CloudForge Rust workspace
[workspace]
resolver = "2"
members = [
    "core/api-gateway",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Reaccionador2Jeje/CloudForge"
rust-version = "1.78"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
